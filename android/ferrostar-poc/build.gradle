plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'no.govia.mobile.ferrostar.poc'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Export the core types because the app-side comparison test consumes Route/TripState directly.
    api 'com.stadiamaps.ferrostar:core:0.53.0'
    testImplementation 'junit:junit:4.13.2'
}
