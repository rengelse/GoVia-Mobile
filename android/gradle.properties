# GoVia Android build runtime
# Keep enough heap for AGP/Flutter transforms without allowing worker fan-out to
# exhaust the GitHub-hosted runner.
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true

# Jetifier is still required by mixed/legacy Android dependencies (notably
# AndroidX Car App), but Flutter engine architecture jars are already safe and
# are very large. Skipping them avoids the JetifyTransform heap blow-up seen in
# GitHub Actions while retaining Jetifier for dependencies that actually need it.
android.enableJetifier=true
android.jetifier.ignorelist=arm64_v8a_debug,armeabi_v7a_debug,x86_debug,x86_64_debug

# Flutter 3.47 compatibility mode while third-party plugins still apply KGP.
android.builtInKotlin=false
android.newDsl=false
