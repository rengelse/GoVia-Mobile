name: Ferrostar PoC Runtime Comparison Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ferrostar-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Configure Flutter Android SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compile and test Ferrostar adapter gate
        run: |
          cd android
          gradle :ferrostar-poc:testDebugUnitTest --stacktrace
      - name: Run GoVia vs Ferrostar runtime comparison on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            gradle :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=no.govia.mobile.car.FerrostarRuntimeComparisonTest \
              --info --stacktrace
            cd ..
            adb exec-out run-as no.govia.mobile cat cache/govia-ferrostar-runtime-report.json > govia-ferrostar-runtime-report.json
            test -s govia-ferrostar-runtime-report.json
      - name: Upload runtime decision report
        uses: actions/upload-artifact@v4
        with:
          name: govia-ferrostar-runtime-report
          path: govia-ferrostar-runtime-report.json
          if-no-files-found: error
