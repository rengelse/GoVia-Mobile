name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android runner if wrapper is missing
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
            cp android/app/build.gradle /tmp/app-build.gradle
            cp android/settings.gradle /tmp/settings.gradle
            cp android/build.gradle /tmp/root-build.gradle
            cp android/gradle.properties /tmp/gradle.properties
            flutter create --platforms=android --org no.govia --project-name govia_mobile .
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            cp /tmp/app-build.gradle android/app/build.gradle
            cp /tmp/settings.gradle android/settings.gradle
            cp /tmp/root-build.gradle android/build.gradle
            cp /tmp/gradle.properties android/gradle.properties
          fi

      - name: Verify GoVia brand assets
        shell: bash
        run: |
          test -s assets/brand/govia-logo-horizontal.png || (echo 'Missing assets/brand/govia-logo-horizontal.png' && exit 1)
          test -s assets/brand/govia-icon-512.png || (echo 'Missing assets/brand/govia-icon-512.png' && exit 1)

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build unsigned debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug --dart-define=GOVIA_NAV_SIMULATOR=true

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: govia-mobile-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'ANDROID_KEYSTORE_BASE64 is missing' && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/govia-mobile-release.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../govia-mobile-release.jks
          PROPS

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --dart-define=GOVIA_API_BASE_URL="https://govia.no" \
            --dart-define=GOVIA_NAV_SIMULATOR=true \
            --dart-define=GOVIA_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            --dart-define=GOVIA_MOBILE_GITHUB_REPO="${GITHUB_REPOSITORY#*/}"
          cp build/app/outputs/flutter-apk/app-release.apk "GoVia-Mobile-v${VERSION}.apk"
          sha256sum "GoVia-Mobile-v${VERSION}.apk" > "GoVia-Mobile-v${VERSION}.apk.sha256"

      - name: Upload CI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: govia-mobile-${{ github.ref_name }}
          path: |
            GoVia-Mobile-*.apk
            GoVia-Mobile-*.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GoVia-Mobile-*.apk
            GoVia-Mobile-*.sha256
          generate_release_notes: true
