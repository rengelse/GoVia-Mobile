name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1 with build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Configure Flutter Android SDK path
        shell: bash
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties
      - name: Verify GoVia brand assets
        run: |
          test -s assets/brand/govia-logo-horizontal.png
          test -s assets/brand/govia-icon-512.png
      - name: Static release preflight
        run: python3 tool/release_preflight.py
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Authoritative Ferrostar navigation acceptance gate
        env:
          GOVIA_GRADLE_COMMAND: gradle
        run: python3 tool/navigation_acceptance_gate.py
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Android package preflight
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --build-cache --stacktrace
      - name: Ferrostar production runtime on Android
        timeout-minutes: 25
        # ReactiveCircus/android-emulator-runner v2.38.0 pinned to its release commit.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ./android
          script: |
            echo '== emulator/ADB diagnostics =='
            adb devices -l
            adb -s "emulator-${EMULATOR_PORT}" get-state
            test "$(adb -s "emulator-${EMULATOR_PORT}" shell getprop sys.boot_completed | tr -d '\r')" = "1"
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=no.govia.mobile.car.FerrostarProductionRuntimeTest --no-daemon --build-cache --stacktrace
      - name: Build unsigned debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug --dart-define=GOVIA_NAV_SIMULATOR=true
      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: govia-mobile-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo 'ANDROID_KEYSTORE_BASE64 is missing' && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/govia-mobile-release.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../govia-mobile-release.jks
          PROPS
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --dart-define=GOVIA_API_BASE_URL="https://govia.no" \
            --dart-define=GOVIA_NAV_SIMULATOR=true \
            --dart-define=GOVIA_GITHUB_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            --dart-define=GOVIA_MOBILE_GITHUB_REPO="${GITHUB_REPOSITORY#*/}"
          cp build/app/outputs/flutter-apk/app-release.apk "GoVia-Mobile-v${VERSION}.apk"
          sha256sum "GoVia-Mobile-v${VERSION}.apk" > "GoVia-Mobile-v${VERSION}.apk.sha256"
      - name: Upload CI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: govia-mobile-${{ github.ref_name }}
          path: |
            GoVia-Mobile-*.apk
            GoVia-Mobile-*.sha256
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GoVia-Mobile-*.apk
            GoVia-Mobile-*.sha256
          generate_release_notes: true
